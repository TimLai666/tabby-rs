name: Cargo lock fix

on:
  push:
    branches:
      - feature/8-pty-sessions-backpressure

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/8-pty-sessions-backpressure

      - name: Resolve Rust dependencies
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: Commit Cargo.lock
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "build: update Rust lockfile for PTY dependencies"
          git push origin HEAD:feature/8-pty-sessions-backpressure
