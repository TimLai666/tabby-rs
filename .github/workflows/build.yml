name: Windows caption native regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caption-native:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run actual Win32 caption checks
        shell: pwsh
        env:
          RUSTFLAGS: '-C link-arg=/MANIFESTINPUT:${{ github.workspace }}/src-tauri/windows-app-manifest.xml -C link-arg=/MANIFEST:EMBED'
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP 'caption-native-check'
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $example = (Join-Path $env:GITHUB_WORKSPACE 'src-tauri/examples/windows_caption_native.rs').Replace('\', '/')
          $manifest = @"
          [package]
          name = "caption-native-check"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          serde = { version = "1", features = ["derive"] }
          windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_System_Registry","Win32_System_Threading","Win32_UI_WindowsAndMessaging","Win32_UI_Controls","Win32_Graphics_Gdi","Win32_System_LibraryLoader","Win32_UI_Shell","Win32_UI_HiDpi","Win32_UI_Accessibility","Win32_UI_Input_KeyboardAndMouse"] }
          [[bin]]
          name = "windows_caption_native"
          path = "$example"
          "@
          $manifestPath = Join-Path $scratch 'Cargo.toml'
          [IO.File]::WriteAllText($manifestPath, $manifest, [Text.UTF8Encoding]::new($false))
          cargo run --manifest-path $manifestPath --bin windows_caption_native *> "$env:RUNNER_TEMP/caption-native.log"
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/caption-native.log"
          if ($code -ne 0) { throw "Caption native checks failed with exit $code" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caption-native-${{ github.sha }}
          path: ${{ runner.temp }}/caption-native.log
          if-no-files-found: error
