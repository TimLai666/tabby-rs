name: Build
on:
  workflow_dispatch:
    inputs:
      windows_desktop_probe:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-regression:
    if: ${{ inputs.windows_desktop_probe }}
    strategy:
      fail-fast: false
      matrix:
        variant: [red, green]
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run actual Win32 regression before and after correction
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'caption-native-${{ matrix.variant }}'
          New-Item -ItemType Directory -Path $out | Out-Null
          $fixture = Join-Path $env:RUNNER_TEMP 'caption-native-package'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $source = (Join-Path $env:GITHUB_WORKSPACE 'src-tauri/examples/windows_caption_native.rs').Replace('\','/')
          $manifest = @"
          [package]
          name = "tabby-caption-native-fixture"
          version = "0.0.0"
          edition = "2021"
          [workspace]
          [[bin]]
          name = "caption-native-fixture"
          path = "$source"
          [dependencies]
          serde = { version = "=1.0.229", features = ["derive"] }
          windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_System_Pipes", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_DataExchange"] }
          "@
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText((Join-Path $fixture 'Cargo.toml'), $manifest, $utf8)
          $variant = '${{ matrix.variant }}'
          if ($variant -eq 'red') {
            Copy-Item scripts/ci/native-caption-before-resize.rs src-tauri/src/platform/frame_windows_buttons.rs -Force
          }
          $actual = git hash-object src-tauri/src/platform/frame_windows_buttons.rs
          $expected = if ($variant -eq 'red') { 'ad260edd2020aa0afca905e0bb057cc64042a80e' } else { '5c069004de4dc4ac7d70b001f13f5258069457dc' }
          if ($expected -ne $actual) { throw 'Native source does not match its immutable variant' }
          $env:CARGO_ENCODED_RUSTFLAGS = @('-C', "link-arg=/MANIFESTINPUT:$((Resolve-Path src-tauri/windows-app-manifest.xml).Path)", '-C', 'link-arg=/MANIFEST:EMBED') -join [char]0x1f
          cargo generate-lockfile --manifest-path (Join-Path $fixture 'Cargo.toml')
          if ($LASTEXITCODE) { throw 'minimal fixture dependency resolution failed' }
          cargo run --locked --manifest-path (Join-Path $fixture 'Cargo.toml') *> (Join-Path $out 'run.log')
          $exitCode = $LASTEXITCODE
          $log = Get-Content (Join-Path $out 'run.log') -Raw
          $expectedFailure = $exitCode -ne 0 -and $log -match 'right hit mismatch:.+expected 11' -and $log -notmatch 'error\[E[0-9]+\]'
          $passed = if ($variant -eq 'red') { $expectedFailure } else { $exitCode -eq 0 -and $log -match 'windows_caption_native: [0-9]+ checks passed' }
          @{ passed=$passed; variant=$variant; expectedRed=$expectedFailure; exitCode=$exitCode; preFixSourceCommit='a7dcdf363ef964e81f0c97aa68243d4c598adf22'; qaCommit=$env:GITHUB_SHA; productionBlob=$actual; testsSha256=(Get-FileHash src-tauri/examples/windows_caption_native.rs -Algorithm SHA256).Hash; fullParity=$false } | ConvertTo-Json | Set-Content (Join-Path $out 'result.json')
          Copy-Item (Join-Path $fixture 'Cargo.toml'),(Join-Path $fixture 'Cargo.lock') $out
          Write-Output $log
          if (-not $passed) { throw 'Native regression did not produce its expected RED or GREEN result' }
          exit 0
      - name: Preserve actual native RED and GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-caption-native-${{ matrix.variant }}-${{ github.sha }}
          path: ${{ runner.temp }}/caption-native-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 7
