name: Windows restart observer verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-restart-observer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-observer:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check native observer syntax and pure origin cases
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @('restart-process-origin.mjs','restart-process-observer.mjs','test-restart-process-origin.mjs','test-windows-restart-observer.mjs')) {
            node --check "scripts/ci/$file"
            if($LASTEXITCODE){throw "Syntax failed: $file"}
          }
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/observe-windows-restart.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){throw ($errors|Out-String)}
          node scripts/ci/test-restart-process-origin.mjs
          if($LASTEXITCODE){throw 'Pure origin contract failed'}
          node scripts/ci/test-windows-restart-observer.mjs --help
          if($LASTEXITCODE){throw 'Native observer fixture help failed'}
      - name: Prove native positive case rejects an unimplemented origin slot
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'restart-observer-native'
          if(Test-Path -LiteralPath $root){throw 'Evidence root exists'}
          New-Item -ItemType Directory -Path $root|Out-Null
          $red=Join-Path $root 'red-helpers';New-Item -ItemType Directory -Path $red|Out-Null
          foreach($file in @('restart-process-origin.mjs','restart-process-observer.mjs','observe-windows-restart.ps1','test-windows-restart-observer.mjs')) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "scripts/ci/$file") -Destination $red
          }
          $slot=Join-Path $red 'restart-process-origin.mjs'
          $original=Get-Content -LiteralPath $slot -Raw
          if($original -notmatch 'export function proveRestartOrigin'){throw 'Original slot missing'}
          [IO.File]::WriteAllText($slot,"export function proveRestartOrigin () { return {owned:false,reason:'unimplemented native origin proof',chain:[]} }`n",[Text.UTF8Encoding]::new($false))
          $ps=(Get-Command pwsh -ErrorAction Stop).Source
          node (Join-Path $red 'test-windows-restart-observer.mjs') --output (Join-Path $root 'red') --powershell $ps
          if($LASTEXITCODE -ne 1){throw 'Unimplemented native origin slot must fail'}
          $r=Get-Content (Join-Path $root 'red/result.json') -Raw|ConvertFrom-Json
          if($r.status -cne 'FAIL' -or $r.cases.Count -ne 1 -or $r.cases[0].name -cne 'direct Node seed to held PowerShell candidate' -or $r.cases[0].actual -ne $false -or $r.cleanup.passed -ne $true){throw 'RED did not reach the expected native proof assertion and cleanup'}
          $global:LASTEXITCODE=0
      - name: Verify native start history, exited helper ancestry and cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'restart-observer-native'
          $ps=(Get-Command pwsh -ErrorAction Stop).Source
          node scripts/ci/test-windows-restart-observer.mjs --output (Join-Path $root 'green') --powershell $ps
          if($LASTEXITCODE){throw 'Actual Windows observer fixture failed'}
          $r=Get-Content (Join-Path $root 'green/result.json') -Raw|ConvertFrom-Json
          if($r.status -cne 'PASS' -or $r.cases.Count -ne 4 -or $r.cleanup.passed -ne $true){throw 'Native observer readback is incomplete'}
      - name: Preserve native observer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-restart-observer-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/restart-observer-native
          if-no-files-found: error
          retention-days: 7
