name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-caption:
    name: Owned native caption input control
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check native desktop and run control
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'native-caption-control'
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          pwsh -NoProfile -File scripts/ci/probe-windows-desktop.ps1 -OutputDirectory "$root/preflight"
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop preflight failed' }
          & pwsh -NoProfile -File scripts/ci/probe-native-caption.ps1 -Help > "$root/help.log" 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'Native caption control help failed' }
          & pwsh -NoProfile -File scripts/ci/probe-native-caption.ps1 -OutputDirectory $root > "$root/probe.log" 2>&1
          $probeExit = $LASTEXITCODE
          @{
            revision = $env:GITHUB_SHA
            scriptSha256 = (Get-FileHash scripts/ci/probe-native-caption.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
            exitCode = $probeExit
            fullAppAccepted = $false
          } | ConvertTo-Json | Set-Content "$root/provenance.json" -Encoding utf8
          Get-Content "$root/probe.log"
          if ($probeExit -ne 0) { throw "Native caption control failed with exit $probeExit" }
      - name: Preserve native caption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-caption-control-${{ github.sha }}
          path: ${{ runner.temp }}/native-caption-control
          retention-days: 7
          if-no-files-found: error
