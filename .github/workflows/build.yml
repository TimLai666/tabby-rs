name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  YARN_VERSION: '1.22.22'
  YARN_NETWORK_TIMEOUT: '1000000'
  FORCE_COLOR: '1'

jobs:
  quality:
    name: quality (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: git fetch --force --tags https://github.com/Eugeny/tabby.git '+refs/tags/*:refs/tags/*'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify workflow safety
        run: node scripts/ci/assert-workflow-safety.mjs

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            libarchive-tools \
            libfontconfig1-dev \
            libsecret-1-dev

      - name: Install Yarn
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout ${{ env.YARN_NETWORK_TIMEOUT }}

      - name: Build TypeScript declarations
        run: yarn build:typings

      - name: Lint
        run: yarn lint

      - name: Build all packages
        run: yarn build

      - name: Verify build outputs
        run: node scripts/ci/assert-build-output.mjs

  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
          - name: macos
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: git fetch --force --tags https://github.com/Eugeny/tabby.git '+refs/tags/*:refs/tags/*'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Yarn
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout ${{ env.YARN_NETWORK_TIMEOUT }}

      - name: Build all packages
        run: yarn build

      - name: Verify build outputs
        run: node scripts/ci/assert-build-output.mjs
