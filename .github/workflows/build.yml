name: CI
on:
  workflow_dispatch:
    inputs:
      compiled_run_id:
        description: Existing own workflow run containing an unchanged compiled diagnostic host
        type: string
        required: true
      compiled_exe_sha256:
        description: Exact executable hash observed in the original build evidence
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-frame-runtime-reuse-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-frame-runtime:
    name: Windows PTY shell close using verified compiled host
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Acquire verified compiled host and prepare isolated runtime
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILED_RUN_ID: ${{ inputs.compiled_run_id }}
          COMPILED_EXE_SHA256: ${{ inputs.compiled_exe_sha256 }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo=$env:GITHUB_REPOSITORY
          if ($repo -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Bad repository' }
          if ($env:COMPILED_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'Run ID must be positive decimal' }
          if ($env:COMPILED_EXE_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Exe SHA must be 64 lowercase hex' }
          $id=[UInt64]::Parse($env:COMPILED_RUN_ID,[Globalization.CultureInfo]::InvariantCulture)
          $root=Join-Path $env:RUNNER_TEMP 'tabby-rs-windows-frame-reuse'
          if (Test-Path -LiteralPath $root) { throw 'Evidence root already exists' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $rr=& gh api "/repos/$repo/actions/runs/$id"; if ($LASTEXITCODE) { throw 'Run API failed' }
          $rr | Set-Content (Join-Path $root 'run-metadata.json') -Encoding utf8; $run=$rr|ConvertFrom-Json
          if ($run.id -ne $id -or $run.event -ne 'workflow_dispatch' -or $run.head_repository.full_name -cne $repo -or $run.path -cne '.github/workflows/build.yml' -or $run.head_sha -cnotmatch '^[0-9a-f]{40}$') { throw 'Run provenance mismatch' }
          $src=$run.head_sha
          & git cat-file -e "$src^{commit}" 2>$null
          if ($LASTEXITCODE) { & git fetch origin $src; if ($LASTEXITCODE) { throw 'Exact source fetch failed' } }
          & git cat-file -e "$src^{commit}"
          if ($LASTEXITCODE -or (& git rev-parse "$src^{commit}").Trim() -cne $src) { throw 'Source SHA not resolved exactly' }
          $buildRaw=& git show "${src}:.github/workflows/build.yml"
          if ($LASTEXITCODE -ne 0) { throw 'Source build workflow could not be read' }
          $buildText=$buildRaw -join "`n"
          $artifactStep=[regex]::Match($buildText,'(?ms)- name: Preserve compiled diagnostic host for bounded tool reruns.*?(?=^\s{6}- name:|\z)').Value
          if (-not $artifactStep -or $artifactStep -notmatch 'uses: actions/upload-artifact@v4' -or $artifactStep -notmatch 'name: windows-desktop-native-\$\{\{\s*github\.sha\s*\}') { throw 'Source preserve step does not upload the expected immutable v4 artifact' }
          $ar=& gh api "/repos/$repo/actions/runs/$id/artifacts"; if ($LASTEXITCODE) { throw 'Artifact API failed' }
          $ar | Set-Content (Join-Path $root 'artifact-metadata.json') -Encoding utf8
          $name="windows-desktop-native-$src"; $a=@(($ar|ConvertFrom-Json).artifacts|Where-Object {$_.name -ceq $name -and !$_.expired})
          if ($a.Count -ne 1 -or $a[0].digest -cnotmatch '^sha256:[0-9a-f]{64}$' -or $a[0].size_in_bytes -le 0) { throw 'Artifact identity/digest invalid' }; $a=$a[0]
          $j=& gh run view $id --repo $repo --json jobs; if ($LASTEXITCODE) { throw 'Job API failed' }
          $pres=@(($j|ConvertFrom-Json).jobs|%{$_.steps}|?{$_.name -ceq 'Preserve compiled diagnostic host for bounded tool reruns'})
          if ($pres.Count -ne 1 -or $pres[0].conclusion -cne 'success') { throw 'Artifact-preserve step not uniquely successful' }
          $ex=@(':(exclude).github/workflows/build.yml',':(exclude)scripts/ci/**')
          & git diff --exit-code $src $env:GITHUB_SHA -- . @ex
          if ($LASTEXITCODE) { throw 'Product/renderer source differs from compiled source' }
          $cd=Join-Path $root 'compiled-host'; New-Item -ItemType Directory -Path $cd|Out-Null
          & gh run download $id --repo $repo --name $name --dir $cd; if ($LASTEXITCODE) { throw 'Artifact download failed' }
          $ef=@(Get-ChildItem $cd -Filter tabby-rs.exe -File -Recurse); if ($ef.Count -ne 1) { throw 'Need exactly one tabby-rs.exe' }
          $exe=$ef[0].FullName; $extra=Join-Path $ef[0].Directory.FullName 'resources/extras'
          $cl=Join-Path $extra 'clink/clink_x64.exe'; $u=Join-Path $extra 'UAC.exe'
          foreach($f in @($cl,$u)){if(!(Test-Path -LiteralPath $f -PathType Leaf)){throw "Missing resource $f"}}
          $data=Join-Path $ef[0].Directory.FullName 'data'; if(Test-Path -LiteralPath $data){throw 'Adjacent data exists'}; New-Item -ItemType Directory -Path $data|Out-Null
          $eh=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant(); if($eh -cne $env:COMPILED_EXE_SHA256){throw 'Exe SHA mismatch'}
          $rh=@($cl,$u|%{$h=Get-FileHash $_ -Algorithm SHA256;[ordered]@{path=$_;sha256=$h.Hash.ToLowerInvariant();size=(Get-Item $_).Length}})
          [ordered]@{repo=$repo;run=$id;sourceSha=$src;diagnosticSha=$env:GITHUB_SHA;artifactName=$a.name;artifactId=$a.id;artifactDigest=$a.digest;artifactSize=$a.size_in_bytes;exe=$exe;exeSha256=$eh;resources=$rh}|ConvertTo-Json -Depth 8|Set-Content (Join-Path $root 'verified-host.json') -Encoding utf8
          $pkg=Get-Content (Join-Path $env:GITHUB_WORKSPACE 'package.json') -Raw|ConvertFrom-Json
          $declared=$pkg.dependencies.'playwright-core'; if(-not $declared){$declared=$pkg.devDependencies.'playwright-core'}
          if($declared -cne '1.62.1'){throw 'package.json must declare playwright-core exactly at 1.62.1'}
          $modpath=Join-Path $env:GITHUB_WORKSPACE 'node_modules/playwright-core'; if(Test-Path -LiteralPath $modpath){throw 'Existing checkout Playwright module'}; $nodeModules=Split-Path $modpath -Parent; if(!(Test-Path -LiteralPath $nodeModules)){New-Item -ItemType Directory -Path $nodeModules|Out-Null}
          $rt=Join-Path $root 'playwright-runtime'; New-Item -ItemType Directory -Path $rt|Out-Null
          npm install --ignore-scripts --no-package-lock --prefix $rt playwright-core@1.62.1; if($LASTEXITCODE){throw 'Isolated npm install failed'}
          $mod=Join-Path $rt 'node_modules/playwright-core'; if((Get-Content (Join-Path $mod 'package.json') -Raw|ConvertFrom-Json).version -cne '1.62.1'){throw 'Playwright version mismatch'}
          New-Item -ItemType Junction -Path $modpath -Target $mod|Out-Null
          $ref=Join-Path $root 'reference-runtime'; New-Item -ItemType Directory -Path $ref|Out-Null
          $zip=Join-Path $ref 'tabby-1.0.235-portable-x64.zip'; $url='https://github.com/Eugeny/tabby/releases/download/v1.0.235/tabby-1.0.235-portable-x64.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip; $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -cne '192ee1f402e046f8be5a31118da1dfa38aa290387e7e57dceafcc0b3dfd1a835' -or (Get-Item $zip).Length -ne 174563816){throw 'Pinned original hash/size mismatch'}
          $app=Join-Path $ref 'app'; Expand-Archive $zip -DestinationPath $app; $rf=@(Get-ChildItem $app -Filter Tabby.exe -File -Recurse)
          if($rf.Count -ne 1){throw 'Expected one original exe'}; $re=$rf[0].FullName; $rd=Join-Path $rf[0].Directory.FullName 'data'
          if(Test-Path -LiteralPath $rd){throw 'Original adjacent data exists'}; New-Item -ItemType Directory -Path $rd|Out-Null
          [ordered]@{tag='v1.0.235';baselineCommit='14e2d60b9b6dee84a53c37f05eefeb803787de04';url=$url;sha256=$hash;size=(Get-Item $zip).Length;diagnosticRevision=$env:GITHUB_SHA;nativeProductRevision='e0b26631bb40bafeecfa20c6c6b30dc37c63b8f2'}|ConvertTo-Json|Set-Content (Join-Path $ref 'reference-metadata.json') -Encoding utf8
          "TABBY_DESKTOP_RS_EXE=$exe"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TABBY_DESKTOP_REFERENCE_EXE=$re"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check tools and controlled fixtures
        shell: pwsh
        run: |
          node --check scripts/ci/capture-windows-apps.mjs
          if($LASTEXITCODE){throw 'capture syntax'}
          node --check scripts/ci/exercise-windows-frame.mjs
          if($LASTEXITCODE){throw 'frame syntax'}
          node --check scripts/ci/exercise-windows-terminal.mjs
          if($LASTEXITCODE){throw 'terminal syntax'}
          node scripts/ci/capture-windows-apps.mjs --help
          if($LASTEXITCODE){throw 'capture help'}
          node scripts/ci/test-windows-frame-cdp-ownership.mjs
          if($LASTEXITCODE){throw 'CDP fixture'}
          node scripts/ci/test-windows-frame-flow-stop.mjs
          if($LASTEXITCODE){throw 'flow-stop fixture'}
          $t=$null;$e=$null;$ast=[System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/exercise-windows-window-input.ps1'),[ref]$t,[ref]$e)
          if($e.Count){throw ($e|Out-String)}
          $code=$ast.Find({param($n)$n -is [System.Management.Automation.Language.StringConstantExpressionAst] -and $n.Value.StartsWith('using System;')},$true)
          if(!$code){throw 'C# here-string absent'}; Add-Type -TypeDefinition $code.Value -Language CSharp -ErrorAction Stop
      - name: Check caption native helper and lifecycle guards
        shell: pwsh
        run: |
          node --check scripts/ci/run-windows-caption-desktop.mjs
          if($LASTEXITCODE){throw 'caption desktop adapter syntax'}
          node scripts/ci/test-caption-lifecycle.mjs
          if($LASTEXITCODE){throw 'caption lifecycle guard tests'}
          foreach($script in @('invoke-windows-caption.ps1','probe-windows-caption-color.ps1')) {
            $t=$null;$e=$null;$ast=[System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE "scripts/ci/$script"),[ref]$t,[ref]$e)
            if($e.Count){throw ($e|Out-String)}
            Get-Help (Join-Path $env:GITHUB_WORKSPACE "scripts/ci/$script") -Full|Out-String|Write-Output
            if($script -eq 'invoke-windows-caption.ps1') {
              $code=$ast.Find({param($n)$n -is [System.Management.Automation.Language.StringConstantExpressionAst] -and $n.Value.StartsWith('using System;')},$true)
              if(!$code){throw 'Caption native C# source missing'};Add-Type -TypeDefinition $code.Value -Language CSharp -ErrorAction Stop
            }
          }
      - name: Check desktop probe and WebView2
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'tabby-rs-windows-frame-reuse/preflight'; New-Item -ItemType Directory -Path $d|Out-Null
          pwsh -NoProfile -File scripts/ci/probe-windows-desktop.ps1 -OutputDirectory $d
          if($LASTEXITCODE){throw 'desktop probe failed'}
          $w=@(Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" -ErrorAction SilentlyContinue)
          if(!$w.Count){throw 'WebView2 missing'}
          $w|Select-Object FullName,@{Name='Version';Expression={$_.VersionInfo.FileVersion}}|ConvertTo-Json -Depth 4|Set-Content (Join-Path $d 'webview2-runtime.json')
      - name: Reject occupied CDP ports before app launch
        shell: pwsh
        run: |
          $one=[Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback,9222);$two=[Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback,9223)
          try {
            $one.Start();$two.Start();$d=Join-Path $env:RUNNER_TEMP 'tabby-rs-windows-frame-reuse/cdp-occupied'
            node scripts/ci/capture-windows-apps.mjs --reference-exe "$env:TABBY_DESKTOP_REFERENCE_EXE" --rs-exe "$env:TABBY_DESKTOP_RS_EXE" --output "$d" --source-revision "$env:GITHUB_SHA"
            $x=$LASTEXITCODE;if($x -ne 1){throw 'Expected negative exit 1'}
            $p=Join-Path $d 'result.json';if(!(Test-Path -LiteralPath $p)){throw 'Negative result missing'};$r=Get-Content $p -Raw|ConvertFrom-Json
            foreach($role in @('reference','native')){if($r.$role.launched -ne $false -or $r.$role.error -notmatch 'CDP port is already occupied'){throw "$role launched or wrong error"}}
            if(!$one.Server.IsBound -or !$two.Server.IsBound){throw 'Listeners did not survive'}
            $global:LASTEXITCODE=0
          } finally {$one.Stop();$two.Stop()}
      - name: Capture both actual applications
        timeout-minutes: 16
        shell: pwsh
        run: node scripts/ci/capture-windows-apps.mjs --reference-exe "$env:TABBY_DESKTOP_REFERENCE_EXE" --rs-exe "$env:TABBY_DESKTOP_RS_EXE" --output "$env:RUNNER_TEMP/tabby-rs-windows-frame-reuse/capture" --source-revision "$env:GITHUB_SHA" --flow frame
      - name: Preserve frame runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-frame-runtime-reuse-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tabby-rs-windows-frame-reuse/run-metadata.json
            ${{ runner.temp }}/tabby-rs-windows-frame-reuse/artifact-metadata.json
            ${{ runner.temp }}/tabby-rs-windows-frame-reuse/verified-host.json
            ${{ runner.temp }}/tabby-rs-windows-frame-reuse/reference-runtime/reference-metadata.json
            ${{ runner.temp }}/tabby-rs-windows-frame-reuse/capture/**
            ${{ runner.temp }}/tabby-rs-windows-frame-reuse/preflight/**
            ${{ runner.temp }}/tabby-rs-windows-frame-reuse/cdp-occupied/**
          if-no-files-found: error
          retention-days: 7
