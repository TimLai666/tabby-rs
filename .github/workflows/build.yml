name: Build

on:
  workflow_dispatch:
    inputs:
      windows_desktop_probe:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pointer-coordinate-control:
    name: Actual Windows pointer coordinates and resize control
    if: ${{ inputs.windows_desktop_probe }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual pointer coordinates and native resize
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/ci/test-windows-pointer-coordinates.ps1 -HelperPath "$env:GITHUB_WORKSPACE/scripts/ci/exercise-windows-window-input.ps1" -OutputDirectory "$env:RUNNER_TEMP/windows-pointer-coordinate-control"
          if ($LASTEXITCODE) { throw 'Actual pointer/resize control failed; inspect result.json' }
      - name: Preserve exact native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pointer-control-${{ github.sha }}
          path: ${{ runner.temp }}/windows-pointer-coordinate-control
          if-no-files-found: error
          retention-days: 7
