name: CI
on:
  workflow_dispatch:
    inputs:
      windows_desktop_probe:
        type: boolean
        default: false
      compiled_run_id:
        type: string
        required: true
      compiled_exe_sha256:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-caption-restart-reuse-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-desktop-probe:
    name: Windows captions and process restart using verified compiled host
    if: ${{ inputs.windows_desktop_probe }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Acquire verified compiled host and prepare isolated runtime
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILED_RUN_ID: ${{ inputs.compiled_run_id }}
          COMPILED_EXE_SHA256: ${{ inputs.compiled_exe_sha256 }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $repo=$env:GITHUB_REPOSITORY
          if ($repo -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Bad repository' }
          if ($env:COMPILED_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'Run ID must be positive decimal' }
          if ($env:COMPILED_EXE_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Exe SHA must be 64 lowercase hex' }
          $id=[UInt64]::Parse($env:COMPILED_RUN_ID,[Globalization.CultureInfo]::InvariantCulture)
          $root=Join-Path $env:RUNNER_TEMP 'tabby-rs-windows-desktop-compare'
          if (Test-Path -LiteralPath $root) { throw 'Evidence root already exists' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $rr=& gh api "/repos/$repo/actions/runs/$id"; if ($LASTEXITCODE) { throw 'Run API failed' }
          $rr | Set-Content (Join-Path $root 'run-metadata.json') -Encoding utf8; $run=$rr|ConvertFrom-Json
          if ($run.id -ne $id -or $run.event -ne 'workflow_dispatch' -or $run.head_repository.full_name -cne $repo -or $run.path -cne '.github/workflows/build.yml' -or $run.head_sha -cnotmatch '^[0-9a-f]{40}$') { throw 'Run provenance mismatch' }
          $src=$run.head_sha
          & git cat-file -e "$src^{commit}" 2>$null
          if ($LASTEXITCODE) { & git fetch origin $src; if ($LASTEXITCODE) { throw 'Exact source fetch failed' } }
          & git cat-file -e "$src^{commit}"
          if ($LASTEXITCODE -or (& git rev-parse "$src^{commit}").Trim() -cne $src) { throw 'Source SHA not resolved exactly' }
          $buildRaw=& git show "${src}:.github/workflows/build.yml"
          if ($LASTEXITCODE -ne 0) { throw 'Source build workflow could not be read' }
          $buildText=$buildRaw -join "`n"
          $artifactStep=[regex]::Match($buildText,'(?ms)- name: Preserve compiled diagnostic host for bounded tool reruns.*?(?=^\s{6}- name:|\z)').Value
          if (-not $artifactStep -or $artifactStep -notmatch 'uses: actions/upload-artifact@v4' -or $artifactStep -notmatch 'name: windows-desktop-native-\$\{\{\s*github\.sha\s*\}') { throw 'Source preserve step does not upload the expected immutable v4 artifact' }
          $ar=& gh api "/repos/$repo/actions/runs/$id/artifacts"; if ($LASTEXITCODE) { throw 'Artifact API failed' }
          $ar | Set-Content (Join-Path $root 'artifact-metadata.json') -Encoding utf8
          $name="windows-desktop-native-$src"; $a=@(($ar|ConvertFrom-Json).artifacts|Where-Object {$_.name -ceq $name -and !$_.expired})
          if ($a.Count -ne 1 -or $a[0].digest -cnotmatch '^sha256:[0-9a-f]{64}$' -or $a[0].size_in_bytes -le 0) { throw 'Artifact identity/digest invalid' }; $a=$a[0]
          $j=& gh run view $id --repo $repo --json jobs; if ($LASTEXITCODE) { throw 'Job API failed' }
          $pres=@(($j|ConvertFrom-Json).jobs|%{$_.steps}|?{$_.name -ceq 'Preserve compiled diagnostic host for bounded tool reruns'})
          if ($pres.Count -ne 1 -or $pres[0].conclusion -cne 'success') { throw 'Artifact-preserve step not uniquely successful' }
          $ex=@(':(exclude).github/workflows/build.yml',':(exclude)scripts/ci/**')
          & git diff --exit-code $src $env:GITHUB_SHA -- . @ex
          if ($LASTEXITCODE) { throw 'Product/renderer source differs from compiled source' }
          $cd=Join-Path $root 'compiled-host'; New-Item -ItemType Directory -Path $cd|Out-Null
          & gh run download $id --repo $repo --name $name --dir $cd; if ($LASTEXITCODE) { throw 'Artifact download failed' }
          $ef=@(Get-ChildItem $cd -Filter tabby-rs.exe -File -Recurse); if ($ef.Count -ne 1) { throw 'Need exactly one tabby-rs.exe' }
          $exe=$ef[0].FullName; $extra=Join-Path $ef[0].Directory.FullName 'resources/extras'
          $cl=Join-Path $extra 'clink/clink_x64.exe'; $u=Join-Path $extra 'UAC.exe'
          foreach($f in @($cl,$u)){if(!(Test-Path -LiteralPath $f -PathType Leaf)){throw "Missing resource $f"}}
          $data=Join-Path $ef[0].Directory.FullName 'data'; if(Test-Path -LiteralPath $data){throw 'Adjacent data exists'}; New-Item -ItemType Directory -Path $data|Out-Null
          $eh=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant(); if($eh -cne $env:COMPILED_EXE_SHA256){throw 'Exe SHA mismatch'}
          $rh=@($cl,$u|%{$h=Get-FileHash $_ -Algorithm SHA256;[ordered]@{path=$_;sha256=$h.Hash.ToLowerInvariant();size=(Get-Item $_).Length}})
          [ordered]@{repo=$repo;run=$id;sourceSha=$src;diagnosticSha=$env:GITHUB_SHA;artifactName=$a.name;artifactId=$a.id;artifactDigest=$a.digest;artifactSize=$a.size_in_bytes;exe=$exe;exeSha256=$eh;resources=$rh}|ConvertTo-Json -Depth 8|Set-Content (Join-Path $root 'verified-host.json') -Encoding utf8
          $pkg=Get-Content (Join-Path $env:GITHUB_WORKSPACE 'package.json') -Raw|ConvertFrom-Json
          $declared=$pkg.dependencies.'playwright-core'; if(-not $declared){$declared=$pkg.devDependencies.'playwright-core'}
          if($declared -cne '1.62.1'){throw 'package.json must declare playwright-core exactly at 1.62.1'}
          $modpath=Join-Path $env:GITHUB_WORKSPACE 'node_modules/playwright-core'; if(Test-Path -LiteralPath $modpath){throw 'Existing checkout Playwright module'}; $nodeModules=Split-Path $modpath -Parent; if(!(Test-Path -LiteralPath $nodeModules)){New-Item -ItemType Directory -Path $nodeModules|Out-Null}
          $rt=Join-Path $root 'playwright-runtime'; New-Item -ItemType Directory -Path $rt|Out-Null
          $lock=Get-Content (Join-Path $env:GITHUB_WORKSPACE 'yarn.lock') -Raw
          if($lock -notmatch '(?m)^js-yaml@\^4\.1\.0:\r?\n  version "4\.3\.0"'){throw 'Locked js-yaml version differs from diagnostic runtime'}
          npm install --ignore-scripts --no-package-lock --prefix $rt playwright-core@1.62.1 js-yaml@4.3.0; if($LASTEXITCODE){throw 'Isolated npm install failed'}
          $mod=Join-Path $rt 'node_modules/playwright-core'; if((Get-Content (Join-Path $mod 'package.json') -Raw|ConvertFrom-Json).version -cne '1.62.1'){throw 'Playwright version mismatch'}
          New-Item -ItemType Junction -Path $modpath -Target $mod|Out-Null
          $yamlMod=Join-Path $rt 'node_modules/js-yaml'; $yamlLink=Join-Path $nodeModules 'js-yaml'
          if((Get-Content (Join-Path $yamlMod 'package.json') -Raw|ConvertFrom-Json).version -cne '4.3.0' -or (Test-Path -LiteralPath $yamlLink)){throw 'Fresh locked YAML module required'}
          New-Item -ItemType Junction -Path $yamlLink -Target $yamlMod|Out-Null
          $ref=Join-Path $root 'reference-runtime'; New-Item -ItemType Directory -Path $ref|Out-Null
          $zip=Join-Path $ref 'tabby-1.0.235-portable-x64.zip'; $url='https://github.com/Eugeny/tabby/releases/download/v1.0.235/tabby-1.0.235-portable-x64.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip; $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -cne '192ee1f402e046f8be5a31118da1dfa38aa290387e7e57dceafcc0b3dfd1a835' -or (Get-Item $zip).Length -ne 174563816){throw 'Pinned original hash/size mismatch'}
          $app=Join-Path $ref 'app'; Expand-Archive $zip -DestinationPath $app; $rf=@(Get-ChildItem $app -Filter Tabby.exe -File -Recurse)
          if($rf.Count -ne 1){throw 'Expected one original exe'}; $re=$rf[0].FullName; $rd=Join-Path $rf[0].Directory.FullName 'data'
          if(Test-Path -LiteralPath $rd){throw 'Original adjacent data exists'}; New-Item -ItemType Directory -Path $rd|Out-Null
          [ordered]@{tag='v1.0.235';baselineCommit='14e2d60b9b6dee84a53c37f05eefeb803787de04';url=$url;sha256=$hash;size=(Get-Item $zip).Length;diagnosticRevision=$env:GITHUB_SHA;nativeProductRevision='6c0ee0ffae2034def1758a2106f706b8c38bde28'}|ConvertTo-Json|Set-Content (Join-Path $ref 'reference-metadata.json') -Encoding utf8
          "TABBY_DESKTOP_RS_EXE=$exe"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TABBY_DESKTOP_REFERENCE_EXE=$re"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check capture tool syntax and help
        shell: pwsh
        run: |
          node --input-type=module -e "await import('./scripts/ci/run-windows-frame-restart.mjs')"
          if($LASTEXITCODE){throw 'Restart driver dependency import failed before GUI input'}
          node --check scripts/ci/capture-windows-apps.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Capture controller syntax failed' }
          node --check scripts/ci/exercise-windows-frame.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Frame interaction syntax failed' }
          node --check scripts/ci/exercise-windows-terminal.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Terminal interaction syntax failed' }
          node --check scripts/ci/capture-exited-process-fixture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Process-exit fixture syntax failed' }
          node scripts/ci/capture-windows-apps.mjs --help
          if ($LASTEXITCODE -ne 0) { throw 'Capture controller help failed' }
          node scripts/ci/test-windows-frame-cdp-ownership.mjs
          if ($LASTEXITCODE -ne 0) { throw 'CDP ownership controlled checks failed' }
          node scripts/ci/test-windows-frame-flow-stop.mjs
          if ($LASTEXITCODE -ne 0) { throw 'GUI flow cleanup-stop checks failed' }
          node scripts/ci/test-windows-frame-config-readback.mjs
          if ($LASTEXITCODE) { throw 'Window frame sparse-default readback checks failed' }
          node scripts/ci/test-windows-frame-restore-settling.mjs
          if ($LASTEXITCODE) { throw 'Restore exact-bound settling controlled checks failed' }
          pwsh -NoProfile -File scripts/ci/test-windows-input-caption-fallback.ps1
          if ($LASTEXITCODE) { throw 'Caption fallback controlled checks failed' }
          foreach ($script in @('exercise-windows-window-input.ps1', 'capture-windows-app-window.ps1', 'press-windows-app-dialog.ps1', 'modal-observer-fixture.ps1','probe-windows-caption-color.ps1','invoke-windows-caption.ps1','observe-windows-restart.ps1','test-windows-input-caption-fallback.ps1','test-windows-restart-identity.ps1')) {
            $tokens = $null; $errors = $null
            $path = Join-Path $env:GITHUB_WORKSPACE "scripts/ci/$script"
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
            Get-Help $path -Full | Out-String | Write-Output
          }
          $inputAst = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/exercise-windows-window-input.ps1'),
            [ref]$tokens, [ref]$errors)
          $nativeCode = $inputAst.Find({
            param($node)
            $node -is [System.Management.Automation.Language.StringConstantExpressionAst] -and
              $node.Value.StartsWith('using System;')
          }, $true)
          if (-not $nativeCode) { throw 'Input helper C# source was not found' }
          Add-Type -TypeDefinition $nativeCode.Value -Language CSharp -ErrorAction Stop
          node --check scripts/ci/run-windows-caption-desktop.mjs
          if ($LASTEXITCODE) { throw 'Caption desktop adapter syntax failed' }
          node scripts/ci/test-caption-lifecycle.mjs
          if ($LASTEXITCODE) { throw 'Caption lifecycle orchestration checks failed' }
          $captionAst = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/invoke-windows-caption.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          $captionCode = $captionAst.Find({ param($node)
            $node -is [System.Management.Automation.Language.StringConstantExpressionAst] -and $node.Value.StartsWith('using System;')
          }, $true)
          if (-not $captionCode) { throw 'Caption native C# source was not found' }
          Add-Type -TypeDefinition $captionCode.Value -Language CSharp -ErrorAction Stop
      - name: Check native desktop rendering
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/probe-windows-desktop.ps1 -OutputDirectory "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/preflight"
      - name: Check WebView2 runtime
        shell: pwsh
        run: |
          $runtime = @(Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" -ErrorAction SilentlyContinue)
          if ($runtime.Count -eq 0) { throw 'WebView2 runtime is missing; no full app rendering can be accepted' }
          $runtime | Select-Object FullName, @{Name='Version';Expression={$_.VersionInfo.FileVersion}} | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/webview2-runtime.json"
      - name: Verify desktop tool process cleanup and modal observation
        timeout-minutes: 3
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'tabby-rs-windows-desktop-compare/tool-checks'
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          node scripts/ci/capture-lifecycle-fixture.mjs "$env:GITHUB_WORKSPACE/scripts/ci/capture-windows-apps.mjs" "$toolRoot/process-cleanup"
          if ($LASTEXITCODE -ne 0) { throw 'Actual process cleanup regression failed' }
          node scripts/ci/capture-exited-process-fixture.mjs "$env:GITHUB_WORKSPACE/scripts/ci/capture-windows-apps.mjs" "$toolRoot/process-exit-race"
          if ($LASTEXITCODE -ne 0) { throw 'Actual process exit race regression failed' }
          pwsh -NoProfile -File scripts/ci/modal-observer-fixture.ps1 -HelperPath "$env:GITHUB_WORKSPACE/scripts/ci/press-windows-app-dialog.ps1" -OutputDirectory "$toolRoot/modal-observer"
          if ($LASTEXITCODE -ne 0) { throw 'Actual native dialog observer regression failed' }
      - name: Verify actual pointer and native resize control
        timeout-minutes: 3
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/ci/test-windows-pointer-coordinates.ps1 -HelperPath "$env:GITHUB_WORKSPACE/scripts/ci/exercise-windows-window-input.ps1" -OutputDirectory "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/pointer-control"
          if($LASTEXITCODE){throw 'Actual pointer/resize control failed'}
      - name: Verify restart process origin and finalization guards
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('test-caption-restart.mjs','test-restart-process-origin.mjs','test-restart-observer-final-trace.mjs','test-restart-adoption.mjs','test-restart-seed-refresh.mjs','test-controller-fixture-imports.mjs')) {
            node "scripts/ci/$name"
            if($LASTEXITCODE){throw "Restart controlled guard failed: $name"}
          }
          node scripts/ci/test-windows-restart-observer.mjs --output "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/restart-origin-fixture" --powershell (Get-Command pwsh).Source
          if($LASTEXITCODE){throw 'Actual process-start observer regression failed'}
      - name: Verify restart timestamps and delayed primary-window readiness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $proof=Join-Path $env:RUNNER_TEMP 'tabby-rs-windows-desktop-compare/tool-checks/restart-readiness'
          New-Item -ItemType Directory -Path $proof | Out-Null
          $old=Join-Path $proof 'old-controller.mjs'
          & git show 704663c6329d9ad8507ff90eae5e5f695aecdd6b:scripts/ci/capture-windows-apps.mjs | Set-Content -LiteralPath $old -Encoding utf8
          if($LASTEXITCODE){throw 'Exact old controller cannot be read'}
          $oldPreference=$PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference=$false
            $red=@(& node scripts/ci/test-restart-primary-window-ready.mjs $old 2>&1); $redCode=$LASTEXITCODE
            $red | Out-String | Set-Content (Join-Path $proof 'primary-ready-red.log')
            if($redCode -ne 1 -or ($red -join "`n") -notmatch 'background-only replacement should remain pending'){throw 'Old primary readiness did not fail for the known background-window bug'}
            $red=@(& pwsh -NoProfile -File scripts/ci/test-windows-restart-identity.ps1 -SourcePath $old 2>&1); $redCode=$LASTEXITCODE
            $red | Out-String | Set-Content (Join-Path $proof 'identity-red.log')
            if($redCode -ne 1 -or ($red -join "`n") -notmatch 'Restart identity mismatch: live;'){throw 'Old timestamp comparison did not fail for the known live-process bug'}
          } finally { $PSNativeCommandUseErrorActionPreference=$oldPreference }
          node scripts/ci/test-restart-primary-window-ready.mjs
          if($LASTEXITCODE){throw 'Fixed primary readiness failed'}
          pwsh -NoProfile -File scripts/ci/test-windows-restart-identity.ps1
          if($LASTEXITCODE){throw 'Fixed restart identity filters failed'}
      - name: Require default browser profile selection
        shell: pwsh
        run: |
          if($env:WEBVIEW2_USER_DATA_FOLDER -or $env:TAURI_CONFIG){throw 'Unexpected browser storage or product configuration override'}
      - name: Reject preoccupied CDP ports before launching applications
        shell: pwsh
        run: |
          $first = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 9222)
          $second = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 9223)
          try {
            $first.Start()
            $second.Start()
            $output = Join-Path $env:RUNNER_TEMP 'tabby-rs-windows-desktop-compare/cdp-occupied'
            node scripts/ci/capture-windows-apps.mjs --reference-exe "$env:TABBY_DESKTOP_REFERENCE_EXE" --rs-exe "$env:TABBY_DESKTOP_RS_EXE" --output "$output" --source-revision "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 1) { throw 'Occupied-port capture did not fail as expected' }
            $result = Get-Content -LiteralPath (Join-Path $output 'result.json') -Raw | ConvertFrom-Json
            foreach ($role in @('reference','native')) {
              if ($result.$role.launched -ne $false -or $result.$role.error -notmatch 'CDP port is already occupied') {
                throw "Occupied CDP port did not stop $role before launch"
              }
            }
            if (-not $first.Server.IsBound -or -not $second.Server.IsBound) { throw 'The independent listener was unexpectedly stopped' }
            # The controller's expected exit 1 has been checked above.
            $global:LASTEXITCODE = 0
          } finally {
            $first.Stop()
            $second.Stop()
          }

      - name: Capture both actual applications
        timeout-minutes: 26
        shell: pwsh
        run: node scripts/ci/capture-windows-apps.mjs --reference-exe "$env:TABBY_DESKTOP_REFERENCE_EXE" --rs-exe "$env:TABBY_DESKTOP_RS_EXE" --output "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/capture" --source-revision "$env:GITHUB_SHA" --flow frame
      - name: Preserve full app desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-caption-restart-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tabby-rs-windows-desktop-compare/run-metadata.json
            ${{ runner.temp }}/tabby-rs-windows-desktop-compare/artifact-metadata.json
            ${{ runner.temp }}/tabby-rs-windows-desktop-compare/verified-host.json
            ${{ runner.temp }}/tabby-rs-windows-desktop-compare/reference-runtime/reference-metadata.json
            ${{ runner.temp }}/tabby-rs-windows-desktop-compare/preflight/**
            ${{ runner.temp }}/tabby-rs-windows-desktop-compare/webview2-runtime.json
            ${{ runner.temp }}/tabby-rs-windows-desktop-compare/tool-checks/**
            ${{ runner.temp }}/tabby-rs-windows-desktop-compare/restart-origin-fixture/**
            ${{ runner.temp }}/tabby-rs-windows-desktop-compare/pointer-control/**
            ${{ runner.temp }}/tabby-rs-windows-desktop-compare/cdp-occupied/**
            ${{ runner.temp }}/tabby-rs-windows-desktop-compare/capture/**
          if-no-files-found: error
          retention-days: 7
