name: Build
on:
  workflow_dispatch:
    inputs:
      windows_desktop_probe:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-regression-red:
    if: ${{ inputs.windows_desktop_probe }}
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run actual Win32 regression against immutable pre-fix adapter
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'caption-native-red'
          New-Item -ItemType Directory -Path $out | Out-Null
          $fixture = Join-Path $env:RUNNER_TEMP 'caption-native-package'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $source = (Join-Path $env:GITHUB_WORKSPACE 'src-tauri/examples/windows_caption_native.rs').Replace('\','/')
          $manifest = @"
          [package]
          name = "tabby-caption-native-fixture"
          version = "0.0.0"
          edition = "2021"
          [workspace]
          [[bin]]
          name = "caption-native-fixture"
          path = "$source"
          [dependencies]
          serde = { version = "=1.0.229", features = ["derive"] }
          windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_System_Pipes", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_DataExchange"] }
          "@
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText((Join-Path $fixture 'Cargo.toml'), $manifest, $utf8)
          $expected = git rev-parse a7dcdf363ef964e81f0c97aa68243d4c598adf22:src-tauri/src/platform/frame_windows_buttons.rs
          $actual = git hash-object src-tauri/src/platform/frame_windows_buttons.rs
          if ($expected -ne $actual) { throw 'RED requires the exact immutable pre-fix adapter' }
          $env:CARGO_ENCODED_RUSTFLAGS = @('-C', "link-arg=/MANIFESTINPUT:$((Resolve-Path src-tauri/windows-app-manifest.xml).Path)", '-C', 'link-arg=/MANIFEST:EMBED') -join [char]0x1f
          cargo generate-lockfile --manifest-path (Join-Path $fixture 'Cargo.toml')
          if ($LASTEXITCODE) { throw 'minimal fixture dependency resolution failed' }
          cargo run --locked --manifest-path (Join-Path $fixture 'Cargo.toml') *> (Join-Path $out 'run.log')
          $exitCode = $LASTEXITCODE
          $log = Get-Content (Join-Path $out 'run.log') -Raw
          $expectedFailure = $exitCode -ne 0 -and $log -match 'opaque descendant right-edge recipient.+expected HTRIGHT' -and $log -notmatch 'error\[E[0-9]+\]'
          @{ expectedRed=$expectedFailure; exitCode=$exitCode; sourceCommit='a7dcdf363ef964e81f0c97aa68243d4c598adf22'; qaCommit=$env:GITHUB_SHA; productionBlob=$actual; testsSha256=(Get-FileHash src-tauri/examples/windows_caption_native.rs -Algorithm SHA256).Hash; fullParity=$false } | ConvertTo-Json | Set-Content (Join-Path $out 'result.json')
          Copy-Item (Join-Path $fixture 'Cargo.toml'),(Join-Path $fixture 'Cargo.lock') $out
          Write-Output $log
          if (-not $expectedFailure) { throw 'Expected native deep-recipient regression was not reproduced' }
      - name: Preserve actual native RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-caption-native-red-${{ github.sha }}
          path: ${{ runner.temp }}/caption-native-red
          if-no-files-found: error
          retention-days: 7
