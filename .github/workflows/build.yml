name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      windows_desktop_probe:
        description: Compare the actual Windows original and native application windows
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.windows_desktop_probe && 'desktop-probe' || 'regular' }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  YARN_VERSION: '1.22.22'
  YARN_NETWORK_TIMEOUT: '1000000'
  FORCE_COLOR: '1'

jobs:
  windows-desktop-probe:
    name: Windows caption product comparison
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_desktop_probe }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream tags and verify build version
        shell: pwsh
        run: |
          git fetch --force --tags https://github.com/Eugeny/tabby.git '+refs/tags/*:refs/tags/*'
          if ($LASTEXITCODE -ne 0) { throw 'Upstream build tags could not be fetched' }
          git describe --tags
          if ($LASTEXITCODE -ne 0) { throw 'Build version cannot be described before dependency installation' }
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check capture tool syntax and help
        shell: pwsh
        run: |
          node --check scripts/ci/capture-windows-apps.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Capture controller syntax failed' }
          node --check scripts/ci/exercise-windows-frame.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Frame interaction syntax failed' }
          node --check scripts/ci/exercise-windows-terminal.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Terminal interaction syntax failed' }
          node --check scripts/ci/capture-exited-process-fixture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Process-exit fixture syntax failed' }
          node scripts/ci/capture-windows-apps.mjs --help
          if ($LASTEXITCODE -ne 0) { throw 'Capture controller help failed' }
          node scripts/ci/test-windows-frame-cdp-ownership.mjs
          if ($LASTEXITCODE -ne 0) { throw 'CDP ownership controlled checks failed' }
          node scripts/ci/test-windows-frame-mouse-recovery.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Mouse recovery orchestration checks failed' }
          node scripts/ci/test-windows-frame-flow-stop.mjs
          if ($LASTEXITCODE -ne 0) { throw 'GUI flow cleanup-stop checks failed' }
          node scripts/ci/test-windows-frame-caption-color.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Caption color orchestration checks failed' }
          foreach ($script in @('exercise-windows-window-input.ps1', 'capture-windows-app-window.ps1', 'press-windows-app-dialog.ps1', 'modal-observer-fixture.ps1','probe-windows-caption-color.ps1')) {
            $tokens = $null; $errors = $null
            $path = Join-Path $env:GITHUB_WORKSPACE "scripts/ci/$script"
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
            Get-Help $path -Full | Out-String | Write-Output
          }
          $inputAst = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/exercise-windows-window-input.ps1'),
            [ref]$tokens, [ref]$errors)
          $nativeCode = $inputAst.Find({
            param($node)
            $node -is [System.Management.Automation.Language.StringConstantExpressionAst] -and
              $node.Value.StartsWith('using System;')
          }, $true)
          if (-not $nativeCode) { throw 'Input helper C# source was not found' }
          Add-Type -TypeDefinition $nativeCode.Value -Language CSharp -ErrorAction Stop
      - name: Check native desktop rendering
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/probe-windows-desktop.ps1 -OutputDirectory "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/preflight"
      - name: Check WebView2 runtime
        shell: pwsh
        run: |
          $runtime = @(Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" -ErrorAction SilentlyContinue)
          if ($runtime.Count -eq 0) { throw 'WebView2 runtime is missing; no full app rendering can be accepted' }
          $runtime | Select-Object FullName, @{Name='Version';Expression={$_.VersionInfo.FileVersion}} | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/webview2-runtime.json"
      - name: Verify desktop tool process cleanup and modal observation
        timeout-minutes: 3
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'tabby-rs-windows-desktop-compare/tool-checks'
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          node scripts/ci/capture-lifecycle-fixture.mjs "$env:GITHUB_WORKSPACE/scripts/ci/capture-windows-apps.mjs" "$toolRoot/process-cleanup"
          if ($LASTEXITCODE -ne 0) { throw 'Actual process cleanup regression failed' }
          node scripts/ci/capture-exited-process-fixture.mjs "$env:GITHUB_WORKSPACE/scripts/ci/capture-windows-apps.mjs" "$toolRoot/process-exit-race"
          if ($LASTEXITCODE -ne 0) { throw 'Actual process exit race regression failed' }
          pwsh -NoProfile -File scripts/ci/modal-observer-fixture.ps1 -HelperPath "$env:GITHUB_WORKSPACE/scripts/ci/press-windows-app-dialog.ps1" -OutputDirectory "$toolRoot/modal-observer"
          if ($LASTEXITCODE -ne 0) { throw 'Actual native dialog observer regression failed' }
      - name: Restore Tauri icons
        run: node scripts/restore-tauri-icons.mjs
      - name: Build hardened UAC helper
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found' }
          & $msbuild 'tabby-uac/UAC.sln' '/m' '/p:Configuration=Release' '/p:Platform=x64' '/p:PlatformToolset=v143' '/p:WindowsTargetPlatformVersion=10.0' "/p:OutDir=$env:GITHUB_WORKSPACE\extras\"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$env:GITHUB_WORKSPACE/extras/UAC.exe")) { throw 'Hardened UAC helper compilation failed' }
      - name: Install Windows build dependencies
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/install-nasm.ps1
      - name: Install Yarn
        run: npm install --global yarn@${{ env.YARN_VERSION }}
      - name: Install dependencies
        env:
          TABBY_RS_SKIP_ELECTRON_NATIVE_REBUILD: '1'
        run: yarn install --frozen-lockfile --network-timeout ${{ env.YARN_NETWORK_TIMEOUT }}
      - name: Test focused terminal CLI paste routing
        run: yarn test:terminal-cli-paste
      - name: Build shared packages
        run: yarn build
      - name: Type-check Tauri packages
        run: yarn test:tauri:types
      - name: Check caption lifecycle and Chromium pixels
        shell: pwsh
        run: |
          node scripts/test-windows-caption-service.mjs
          if ($LASTEXITCODE) { throw 'Caption lifecycle checks failed' }
          $browsers=@("${env:ProgramFiles}/Google/Chrome/Application/chrome.exe", "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe")
          $browser=$browsers | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (!$browser) { throw 'No installed Chromium for caption pixel checks' }
          $env:TABBY_CAPTION_TEST_BROWSER=$browser
          node scripts/test-windows-caption-renderer.mjs
          if ($LASTEXITCODE) { throw 'Caption Chromium pixel checks failed' }
      - name: Build Tauri renderer
        run: yarn build:tauri:frontend
      - name: Verify Tauri renderer output
        run: node scripts/ci/assert-tauri-output.mjs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          shared-key: windows-frame-desktop-20261016
          cache-on-failure: true
      - name: Build actual Tauri host with diagnostic CDP port
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          foreach ($window in $config.app.windows) {
            $window | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue '--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --autoplay-policy=no-user-gesture-required --remote-debugging-port=9223'
          }
          $override = @{ app = @{ windows = @($config.app.windows) } }
          $env:TAURI_CONFIG = $override | ConvertTo-Json -Depth 30 -Compress
          $env:TAURI_CONFIG | Set-Content "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/diagnostic-window-config.json"
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Actual native host compilation failed' }
          $native = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/debug/tabby-rs.exe'
          if (-not (Test-Path -LiteralPath $native -PathType Leaf)) { throw 'Native executable is missing' }
          $resourceExtras = Join-Path (Split-Path $native -Parent) 'resources/extras'
          if (Test-Path -LiteralPath $resourceExtras) { throw 'Unexpected existing native diagnostic resources' }
          New-Item -ItemType Directory -Path $resourceExtras | Out-Null
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/extras/clink" -Destination (Join-Path $resourceExtras 'clink') -Recurse
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/extras/UAC.exe" -Destination (Join-Path $resourceExtras 'UAC.exe')
          if (-not (Test-Path -LiteralPath (Join-Path $resourceExtras 'clink/clink_x64.exe') -PathType Leaf)) { throw 'Native Clink resource is missing' }
          Get-ChildItem -LiteralPath $resourceExtras -Recurse -File | Get-FileHash -Algorithm SHA256 | Select-Object Path, Hash | ConvertTo-Json -Depth 5 | Set-Content "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/native-resource-hashes.json"
          $data = Join-Path (Split-Path $native -Parent) 'data'
          if (Test-Path -LiteralPath $data) { throw 'Unexpected pre-existing native portable data' }
          New-Item -ItemType Directory -Path $data | Out-Null
          "TABBY_DESKTOP_RS_EXE=$native" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Download and verify pinned original release
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'tabby-original-1.0.235-runtime'
          if (Test-Path -LiteralPath $root) { throw 'Unexpected pre-existing reference runtime' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $archive = Join-Path $root 'tabby-1.0.235-portable-x64.zip'
          $url = 'https://github.com/Eugeny/tabby/releases/download/v1.0.235/tabby-1.0.235-portable-x64.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '192ee1f402e046f8be5a31118da1dfa38aa290387e7e57dceafcc0b3dfd1a835' -or (Get-Item -LiteralPath $archive).Length -ne 174563816) { throw 'Original release archive does not match pinned digest and size' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $root 'app')
          $executables = @(Get-ChildItem (Join-Path $root 'app') -Recurse -Filter Tabby.exe -File)
          if ($executables.Count -ne 1) { throw 'Expected exactly one original Tabby.exe' }
          $reference = $executables[0].FullName
          $data = Join-Path (Split-Path $reference -Parent) 'data'
          if (-not (Test-Path -LiteralPath $data)) { New-Item -ItemType Directory -Path $data | Out-Null }
          @{ tag = 'v1.0.235'; baselineCommit = '14e2d60b9b6dee84a53c37f05eefeb803787de04'; url = $url; sha256 = $hash; size = (Get-Item -LiteralPath $archive).Length; diagnosticRevision = $env:GITHUB_SHA; nativeProductBase = 'a6ffb7c23b699802b78a76b8223c05e99ab0130a'; nativeProductRevision = '9209f83d7548f90aaec2534fe21291fe2fdf5281' } | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/reference-build-metadata.json"
          "TABBY_DESKTOP_REFERENCE_EXE=$reference" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Preserve compiled diagnostic host for bounded tool reruns
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-native-${{ github.sha }}
          path: |
            src-tauri/target/debug/tabby-rs.exe
            src-tauri/target/debug/resources
          if-no-files-found: error
          retention-days: 2

      - name: Test actual native Windows caption adapter
        timeout-minutes: 6
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'tabby-rs-windows-desktop-compare/native-caption-regression.log'
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example windows_caption_native *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log; throw 'Actual Windows caption adapter checks failed' }
          $report = Get-Content $log -Raw
          if ($report -notmatch 'windows_caption_native: 16 checks passed') { throw 'Native caption checks did not complete all expected groups' }
          Get-Content $log
      - name: Reject preoccupied CDP ports before launching applications
        shell: pwsh
        run: |
          $first = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 9222)
          $second = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 9223)
          try {
            $first.Start()
            $second.Start()
            $output = Join-Path $env:RUNNER_TEMP 'tabby-rs-windows-desktop-compare/cdp-occupied'
            node scripts/ci/capture-windows-apps.mjs --reference-exe "$env:TABBY_DESKTOP_REFERENCE_EXE" --rs-exe "$env:TABBY_DESKTOP_RS_EXE" --output "$output" --source-revision "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 1) { throw 'Occupied-port capture did not fail as expected' }
            $result = Get-Content -LiteralPath (Join-Path $output 'result.json') -Raw | ConvertFrom-Json
            foreach ($role in @('reference','native')) {
              if ($result.$role.launched -ne $false -or $result.$role.error -notmatch 'CDP port is already occupied') {
                throw "Occupied CDP port did not stop $role before launch"
              }
            }
            if (-not $first.Server.IsBound -or -not $second.Server.IsBound) { throw 'The independent listener was unexpectedly stopped' }
            # The controller's expected exit 1 has been checked above.
            $global:LASTEXITCODE = 0
          } finally {
            $first.Stop()
            $second.Stop()
          }

      - name: Capture both actual applications
        timeout-minutes: 10
        shell: pwsh
        run: node scripts/ci/capture-windows-apps.mjs --reference-exe "$env:TABBY_DESKTOP_REFERENCE_EXE" --rs-exe "$env:TABBY_DESKTOP_RS_EXE" --output "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/capture" --source-revision "$env:GITHUB_SHA" --flow frame
      - name: Preserve full app desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-compare-${{ github.sha }}
          path: ${{ runner.temp }}/tabby-rs-windows-desktop-compare
          if-no-files-found: error
          retention-days: 7
