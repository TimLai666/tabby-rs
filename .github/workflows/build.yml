name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-frame-fixture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-frame-fixture:
    name: Extended Windows Wry frame state regression
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          shared-key: windows-native-frame-20261016
          cache-on-failure: true
      - name: Restore Tauri icons
        run: node scripts/restore-tauri-icons.mjs
      - name: Check actual desktop
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/probe-windows-desktop.ps1 -OutputDirectory "$env:RUNNER_TEMP/window-frame-fixture/preflight"
      - name: Install Windows build dependencies
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/install-nasm.ps1
      - name: Build and run actual Wry frame checks
        env:
          RUSTFLAGS: '-C link-arg=/MANIFESTINPUT:${{ github.workspace }}/src-tauri/windows-app-manifest.xml -C link-arg=/MANIFEST:EMBED'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'window-frame-fixture'
          $assets = Join-Path $root 'fixture-assets'
          if (Test-Path -LiteralPath $assets) { throw 'Fixture assets must be fresh' }
          New-Item -ItemType Directory -Path $assets | Out-Null
          '<!doctype html><title>Empty native frame fixture</title>' | Set-Content -LiteralPath (Join-Path $assets 'index.html') -Encoding utf8
          $env:TAURI_CONFIG = @{ build = @{ frontendDist = $assets } } | ConvertTo-Json -Depth 5 -Compress
          $env:TAURI_CONFIG | Set-Content -LiteralPath (Join-Path $root 'fixture-config.json') -Encoding utf8
          & cargo run --locked --manifest-path src-tauri/Cargo.toml --example window_frame_windows_native -- --help > "$root/build-and-help.log" 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content "$root/build-and-help.log" -Tail 70; throw 'Frame example compilation or help failed; this is not a behavioral RED result' }
          $executable = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/debug/examples/window_frame_windows_native.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw 'Native fixture executable is missing' }
          & $executable > "$root/frame-checks.log" 2>&1
          $testExit = $LASTEXITCODE
          @{
            sourceRevision = $env:GITHUB_SHA
            productionBase = '9d8182060450802d5cbd28fee36a0a36325951d9'
            fixtureSha256 = (Get-FileHash -LiteralPath 'src-tauri/examples/window_frame_windows_native.rs' -Algorithm SHA256).Hash.ToLowerInvariant()
            frameBackendSha256 = (Get-FileHash -LiteralPath 'src-tauri/src/platform/frame_windows.rs' -Algorithm SHA256).Hash.ToLowerInvariant()
            regionBackendSha256 = (Get-FileHash -LiteralPath 'src-tauri/src/platform/frame_windows_region.rs' -Algorithm SHA256).Hash.ToLowerInvariant()
            executableSha256 = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
            exitCode = $testExit
            fullAppAccepted = $false
            scope = 'Two owned Wry windows using the production frame backend; native input, maximized client placement, fullscreen round-trip, and ordinary frame focus property checks only. No product renderer, dragging, PTY, restart, persistence, installer, or platform acceptance.'
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$root/result.json" -Encoding utf8
          Get-Content -LiteralPath "$root/frame-checks.log"
          if ($testExit -ne 0) { throw "Native frame property regression failed with exit $testExit" }
      - name: Preserve native frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-frame-${{ github.sha }}
          path: ${{ runner.temp }}/window-frame-fixture
          if-no-files-found: error
          retention-days: 7
