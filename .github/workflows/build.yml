name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      windows_desktop_probe:
        description: Compare the actual Windows original and native application windows
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.windows_desktop_probe && 'desktop-probe' || 'regular' }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  YARN_VERSION: '1.22.22'
  YARN_NETWORK_TIMEOUT: '1000000'
  FORCE_COLOR: '1'

jobs:
  windows-desktop-probe:
    name: Windows full app desktop comparison
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_desktop_probe }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream tags and verify build version
        shell: pwsh
        run: |
          git fetch --force --tags https://github.com/Eugeny/tabby.git '+refs/tags/*:refs/tags/*'
          if ($LASTEXITCODE -ne 0) { throw 'Upstream build tags could not be fetched' }
          git describe --tags
          if ($LASTEXITCODE -ne 0) { throw 'Build version cannot be described before dependency installation' }
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check capture tool syntax and help
        shell: pwsh
        run: |
          node --check scripts/ci/capture-windows-apps.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Capture controller syntax failed' }
          node scripts/ci/capture-windows-apps.mjs --help
          if ($LASTEXITCODE -ne 0) { throw 'Capture controller help failed' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/capture-windows-app-window.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Check native desktop rendering
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/probe-windows-desktop.ps1 -OutputDirectory "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/preflight"
      - name: Check WebView2 runtime
        shell: pwsh
        run: |
          $runtime = @(Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" -ErrorAction SilentlyContinue)
          if ($runtime.Count -eq 0) { throw 'WebView2 runtime is missing; no full app rendering can be accepted' }
          $runtime | Select-Object FullName, @{Name='Version';Expression={$_.VersionInfo.FileVersion}} | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/webview2-runtime.json"
      - name: Restore Tauri icons
        run: node scripts/restore-tauri-icons.mjs
      - name: Build hardened UAC helper
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found' }
          & $msbuild 'tabby-uac/UAC.sln' '/m' '/p:Configuration=Release' '/p:Platform=x64' '/p:PlatformToolset=v143' '/p:WindowsTargetPlatformVersion=10.0' "/p:OutDir=$env:GITHUB_WORKSPACE\extras\"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$env:GITHUB_WORKSPACE/extras/UAC.exe")) { throw 'Hardened UAC helper compilation failed' }
      - name: Install Windows build dependencies
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/install-nasm.ps1
      - name: Install Yarn
        run: npm install --global yarn@${{ env.YARN_VERSION }}
      - name: Install dependencies
        env:
          TABBY_RS_SKIP_ELECTRON_NATIVE_REBUILD: '1'
        run: yarn install --frozen-lockfile --network-timeout ${{ env.YARN_NETWORK_TIMEOUT }}
      - name: Build shared packages
        run: yarn build
      - name: Build Tauri renderer
        run: yarn build:tauri:frontend
      - name: Verify Tauri renderer output
        run: node scripts/ci/assert-tauri-output.mjs
      - name: Build actual Tauri host with diagnostic CDP port
        shell: pwsh
        env:
          RUSTFLAGS: '-C link-arg=/MANIFESTINPUT:${{ github.workspace }}/src-tauri/windows-app-manifest.xml -C link-arg=/MANIFEST:EMBED'
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          foreach ($window in $config.app.windows) {
            $window | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue '--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --autoplay-policy=no-user-gesture-required --remote-debugging-port=9223'
          }
          $override = @{ app = @{ windows = @($config.app.windows) } }
          $env:TAURI_CONFIG = $override | ConvertTo-Json -Depth 30 -Compress
          $env:TAURI_CONFIG | Set-Content "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/diagnostic-window-config.json"
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Actual native host compilation failed' }
          $native = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/debug/tabby-rs.exe'
          if (-not (Test-Path -LiteralPath $native -PathType Leaf)) { throw 'Native executable is missing' }
          $data = Join-Path (Split-Path $native -Parent) 'data'
          if (Test-Path -LiteralPath $data) { throw 'Unexpected pre-existing native portable data' }
          New-Item -ItemType Directory -Path $data | Out-Null
          "TABBY_DESKTOP_RS_EXE=$native" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Download and verify pinned original release
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'tabby-original-1.0.235-runtime'
          if (Test-Path -LiteralPath $root) { throw 'Unexpected pre-existing reference runtime' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $archive = Join-Path $root 'tabby-1.0.235-portable-x64.zip'
          $url = 'https://github.com/Eugeny/tabby/releases/download/v1.0.235/tabby-1.0.235-portable-x64.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '192ee1f402e046f8be5a31118da1dfa38aa290387e7e57dceafcc0b3dfd1a835' -or (Get-Item -LiteralPath $archive).Length -ne 174563816) { throw 'Original release archive does not match pinned digest and size' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $root 'app')
          $executables = @(Get-ChildItem (Join-Path $root 'app') -Recurse -Filter Tabby.exe -File)
          if ($executables.Count -ne 1) { throw 'Expected exactly one original Tabby.exe' }
          $reference = $executables[0].FullName
          $data = Join-Path (Split-Path $reference -Parent) 'data'
          if (-not (Test-Path -LiteralPath $data)) { New-Item -ItemType Directory -Path $data | Out-Null }
          @{ tag = 'v1.0.235'; baselineCommit = '14e2d60b9b6dee84a53c37f05eefeb803787de04'; url = $url; sha256 = $hash; size = (Get-Item -LiteralPath $archive).Length; diagnosticRevision = $env:GITHUB_SHA; nativeProductBase = '9d8182060450802d5cbd28fee36a0a36325951d9' } | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/reference-build-metadata.json"
          "TABBY_DESKTOP_REFERENCE_EXE=$reference" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Capture both actual applications
        shell: pwsh
        run: node scripts/ci/capture-windows-apps.mjs --reference-exe "$env:TABBY_DESKTOP_REFERENCE_EXE" --rs-exe "$env:TABBY_DESKTOP_RS_EXE" --output "$env:RUNNER_TEMP/tabby-rs-windows-desktop-compare/capture" --source-revision "$env:GITHUB_SHA"
      - name: Preserve full app desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-compare-${{ github.sha }}
          path: ${{ runner.temp }}/tabby-rs-windows-desktop-compare
          if-no-files-found: error
          retention-days: 7

  quality:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.windows_desktop_probe) }}
    name: quality (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Tauri icons
        run: node scripts/restore-tauri-icons.mjs

      - name: Fetch upstream tags
        run: git fetch --force --tags https://github.com/Eugeny/tabby.git '+refs/tags/*:refs/tags/*'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify workflow safety
        run: node scripts/ci/assert-workflow-safety.mjs

      - name: Test Docs workflow credential guard
        run: yarn test:docs-workflow

      - name: Test Stable child issue gate contract
        run: yarn test:stable-issue-state

      - name: Test Tauri dependency metadata audit
        run: yarn test:tauri:dependencies

      - name: Test Linux dependency installer contract
        run: node scripts/test-linux-dependencies.mjs

      - name: Install Linux build dependencies
        run: |
          bash scripts/ci/install-linux-dependencies.sh \
            cmake \
            libarchive-tools \
            libayatana-appindicator3-dev \
            libfontconfig1-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            openssh-server \
            patchelf \
            xvfb

      - name: Install Yarn
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout ${{ env.YARN_NETWORK_TIMEOUT }}

      - name: Build TypeScript declarations
        run: yarn build:typings

      - name: Test release platform matrix contract
        run: yarn test:release-platform-matrix

      - name: Lint
        run: yarn lint --format unix

      - name: Verify xterm renderer boundary
        run: node scripts/ci/assert-xterm-boundary.mjs

      - name: Test terminal renderer write ordering
        run: node scripts/ci/test-terminal-renderer.mjs

      - name: Test paste policy
        run: node scripts/ci/test-paste-policy.mjs

      - name: Test terminal path quoting
        run: node scripts/ci/test-path-quoting.mjs
      - name: Test workspace model
        run: node scripts/ci/test-workspace.mjs
      - name: Test progress detector
        run: node scripts/ci/test-progress-detector.mjs
      - name: Test URI policy
        run: node scripts/ci/test-uri-policy.mjs
      - name: Test transfer policy
        run: node scripts/ci/test-transfer-policy.mjs
      - name: Test tab progress aggregation
        run: node scripts/ci/test-tab-progress.mjs

      - name: Test terminal renderer browser parity
        run: node scripts/ci/test-terminal-renderer-browser.mjs

      - name: Test context menu browser parity
        run: node scripts/ci/test-context-menu-browser.mjs

      - name: Test sudo prompt detector
        run: node scripts/ci/test-auto-sudo.mjs

      - name: Build Electron baseline
        run: yarn build

      - name: Verify Electron build outputs
        run: node scripts/ci/assert-build-output.mjs

      - name: Build web container
        run: yarn build:web

      - name: Test web browser smoke
        run: yarn test:web-browser-smoke

      - name: Test web Playwright smoke
        run: yarn test:web-playwright-smoke

      - name: Test web real OpenSSH fixture contract
        run: yarn test:web-real-remote-contract

      - name: Test web real OpenSSH and SFTP smoke
        run: yarn test:web-real-remote

      - name: Verify tabby-web bundle boundary
        run: yarn audit:web

      - name: Verify tabby-web source boundary
        run: yarn test:web-source-boundary

      - name: Verify no built-in telemetry
        run: yarn audit:telemetry

      - name: Test built-in telemetry audit
        run: yarn test:telemetry

      - name: Test tabby-web bundle audit
        run: yarn test:web-output-audit

      - name: Test web host-app contract
        run: yarn test:web-host-app

      - name: Test web connector transport contract
        run: yarn test:web-connector
      - name: Test web connector runtime contract
        run: yarn test:web-connector-runtime

      - name: Test web SSH SFTP Telnet connection smoke
        run: yarn test:web-connection-smoke

      - name: Test web provider contract
        run: yarn test:web-provider-contract

      - name: Test web plugin loader
        run: yarn test:web-plugin-loader

      - name: Test web gateway protocol
        run: yarn test:web-gateway

      - name: Test web capability boundary
        run: yarn test:web-capability-boundary

      - name: Test web process platform mapping
        run: yarn test:web-platform

      - name: Test diagnostics preview gate
        run: yarn test:diagnostics-ui

      - name: Test diagnostics privacy and rotation
        run: yarn test:diagnostics-privacy

      - name: Test release documentation contract
        run: yarn test:release-documentation

      - name: Test Tabby RS branding contract
        run: yarn test:tabby-rs-branding

      - name: Test macOS icon configuration
        run: yarn test:macos-icon-config

      - name: Test Tauri release icon configuration
        run: yarn test:tauri-release-config

      - name: Test parity report contract
        run: yarn test:parity-report

      - name: Test parity automated check links
        run: yarn test:parity-links

      - name: Test parity automated evidence contract
        run: yarn test:parity-evidence

      - name: Test runtime capability providers
        run: yarn test:runtime-capabilities

      - name: Test Tauri platform bridge contract
        run: yarn test:tauri-platform

      - name: Test Tauri window opacity contract
        run: yarn test:tauri-opacity

      - name: Test official plugin runtime fixture
        run: yarn test:official-plugin-runtime

      - name: Test plugin runtime fixtures
        run: yarn test:plugin-runtime

      - name: Test plugin Tauri bridge contract
        run: yarn test:plugin-bridge

      - name: Test safe mode plugin actions
        run: yarn test:safe-mode-plugin-actions

      - name: Test plugin operation contract
        run: yarn test:plugin-operation

      - name: Test system npm plugin lifecycle
        run: yarn test:plugin-npm-lifecycle

      - name: Test plugin node status contract
        run: yarn test:plugin-node-status

      - name: Test plugin node status UI runtime
        run: yarn test:plugin-node-status-ui

      - name: Test Electron updater policy
        run: yarn test:electron-updater

      - name: Test Tauri updater confirmation
        run: yarn test:tauri-updater-confirmation

      - name: Test updater cancellation
        run: yarn test:updater-cancellation

      - name: Test updater generation
        run: yarn test:updater-generation

      - name: Test updater startup policy
        run: yarn test:updater-startup

      - name: Test Tauri update manifest
        run: yarn test:tauri:update-manifest

      - name: Test Tauri multi-window contract
        run: yarn test:tauri-multi-window

      - name: Type-check Tauri packages
        run: yarn test:tauri:types

      - name: Build Tauri renderer
        run: yarn build:tauri:frontend

      - name: Verify Tauri renderer output
        run: node scripts/ci/assert-tauri-output.mjs

      - name: Audit Tauri renderer bundle
        run: yarn test:tauri:bundle

      - name: Test release artifact contract
        run: yarn test:tauri:release-artifacts

      - name: Test release installer smoke fixtures
        run: yarn test:tauri:release-smoke

      - name: Test release checksums
        run: yarn test:release-checksums

      - name: Test updater signature verification
        run: yarn test:tauri:signature

      - name: Test updater fake server fixtures
        run: yarn test:tauri:update-fake-server

      - name: Test license report fixtures
        run: yarn test:license-report

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust host
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test real SSH and SFTP fixture
        run: yarn test:ssh-integration

      - name: Test SSH authentication fixture
        run: yarn test:ssh-auth-integration

      - name: Test SSH session routing contract
        run: yarn test:ssh-session

      - name: Test Telnet and serial login scripts
        run: yarn test:connector-login-scripts

      - name: Test Telnet and serial connection errors
        run: yarn test:connector-errors

      - name: Test serial write queue
        run: yarn test:serial-write-queue

      - name: Test serial tab controls
        run: yarn test:serial-tab-controls

      - name: Test Telnet tab controls
        run: yarn test:telnet-tab-controls

      - name: Test browser readline compatibility
        run: yarn test:tauri-readline

      - name: Test SSH reconnect contract
        run: yarn test:ssh-reconnect

      - name: Build Tauri host
        run: cargo build --manifest-path src-tauri/Cargo.toml

  build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.windows_desktop_probe) }}
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
          - name: macos
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Tauri icons
        run: node scripts/restore-tauri-icons.mjs

      - name: Fetch upstream tags
        run: git fetch --force --tags https://github.com/Eugeny/tabby.git '+refs/tags/*:refs/tags/*'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build hardened UAC helper
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild was not found"
          }
          & $msbuild 'tabby-uac/UAC.sln' '/m' '/p:Configuration=Release' '/p:Platform=x64' '/p:PlatformToolset=v143' '/p:WindowsTargetPlatformVersion=10.0' "/p:OutDir=$env:GITHUB_WORKSPACE\extras\"
          if ($LASTEXITCODE -ne 0) {
            throw "Hardened UAC helper compilation failed"
          }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\extras\UAC.exe")) {
            throw "Hardened UAC helper was not produced"
          }

      - name: Install Windows build dependencies
        if: matrix.name == 'windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/install-nasm.ps1

      - name: Install Yarn
        run: npm install --global yarn@${{ env.YARN_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout ${{ env.YARN_NETWORK_TIMEOUT }}

      - name: Build Electron baseline
        run: yarn build

      - name: Verify Electron build outputs
        run: node scripts/ci/assert-build-output.mjs

      - name: Type-check Tauri packages
        run: yarn test:tauri:types

      - name: Build Tauri renderer
        run: yarn build:tauri:frontend

      - name: Verify Tauri renderer output
        run: node scripts/ci/assert-tauri-output.mjs

      - name: Audit Tauri renderer bundle
        run: yarn test:tauri:bundle

      - name: Test public plugin runtime fixtures
        run: yarn test:official-plugin-runtime

      - name: Test plugin runtime fixtures
        run: yarn test:plugin-runtime

      - name: Test plugin Tauri bridge contract
        run: yarn test:plugin-bridge

      - name: Test safe mode plugin actions
        run: yarn test:safe-mode-plugin-actions

      - name: Test plugin operation contract
        run: yarn test:plugin-operation

      - name: Test system npm plugin lifecycle
        run: yarn test:plugin-npm-lifecycle

      - name: Test plugin node status contract
        run: yarn test:plugin-node-status

      - name: Test plugin node status UI runtime
        run: yarn test:plugin-node-status-ui

      - name: Test updater fake server fixtures
        run: yarn test:tauri:update-fake-server

      - name: Test Rust host
        if: matrix.name != 'windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test Rust host on Windows
        if: matrix.name == 'windows'
        env:
          RUSTFLAGS: '-C link-arg=/MANIFESTINPUT:${{ github.workspace }}/src-tauri/windows-app-manifest.xml -C link-arg=/MANIFEST:EMBED'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Test SSH authentication fixture
        if: matrix.name != 'windows'
        run: yarn test:ssh-auth-integration

      - name: Test SSH session routing contract
        run: yarn test:ssh-session

      - name: Test Telnet and serial login scripts
        run: yarn test:connector-login-scripts

      - name: Test Telnet and serial connection errors
        run: yarn test:connector-errors

      - name: Test serial write queue
        run: yarn test:serial-write-queue

      - name: Test serial tab controls
        run: yarn test:serial-tab-controls

      - name: Test Telnet tab controls
        run: yarn test:telnet-tab-controls

      - name: Test portable WebView storage
        if: matrix.name == 'macos'
        run: yarn test:portable-storage

      - name: Test browser readline compatibility
        run: yarn test:tauri-readline

      - name: Test SSH reconnect contract
        run: yarn test:ssh-reconnect

      - name: Build Tauri host
        run: cargo build --manifest-path src-tauri/Cargo.toml
