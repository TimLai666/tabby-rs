[package]
name = "tabby-rs"
version = "1.0.231-tabbyrs.1"
description = "A Tauri and Rust port of Tabby"
authors = ["Tabby Developers", "Tabby RS Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "tabby_rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "tabby-rs"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes = "0.8.4"
async-trait = "0.1.50"
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["alloc"] }
chrono = { version = "0.4.38", default-features = false, features = ["clock", "serde", "std"] }
hex = "0.4.3"
pbkdf2 = "0.12.2"
portable-pty = "=0.9.0"
rand = "0.8.5"
russh = "=0.54.4"
russh-sftp = "2.4.0"
serialport = "4.9.0"
secrecy = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.10.8"
sysinfo = "=0.30.13"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tempfile = "3.10.1"
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }
thiserror = "2"
url = "2"
zeroize = "1.7.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.153"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
