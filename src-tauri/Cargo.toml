[package]
name = "tabby-rs"
version = "1.0.231-tabbyrs.1"
description = "A Tauri and Rust port of Tabby"
authors = ["Tabby Developers", "Tabby RS Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "tabby_rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "tabby-rs"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
